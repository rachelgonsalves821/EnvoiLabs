<!doctype html>
<html><head><meta charset="utf-8"><title>Status chips</title></head>
<body>
<div class="ev-pad ev-stack" id="root">
  <div class="ev-row">
    <span class="ev-chip ev-chip-good"><i class="ph-bold ph-check-circle"></i>Quality passed</span>
    <span class="ev-chip ev-chip-warn"><i class="ph-bold ph-clock"></i>Ends in 2 hours</span>
    <span class="ev-chip ev-chip-critical"><i class="ph-bold ph-x-circle"></i>Removed, replaced free</span>
    <span class="ev-chip ev-chip-tide"><i class="ph-bold ph-users"></i>Students</span>
  </div>
  <div class="ev-row">
    <span class="ev-chip ev-chip-ink">Must have</span>
    <span class="ev-chip ev-chip-outline">Nice to have</span>
    <span class="ev-chip ev-chip-pulse"><i class="ph-bold ph-microphone"></i>Recording</span>
    <span class="ev-chip">Directional qualitative</span>
  </div>
</div>
<script>document.getElementById('root').setAttribute('data-ready','1');</script>
</body></html>
