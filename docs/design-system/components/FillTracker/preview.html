<!doctype html>
<html><head><meta charset="utf-8"><title>Fill tracker</title>
<style>
.wrap{padding:var(--space-6);max-width:620px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4)}
.rows{margin-top:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.r{display:grid;grid-template-columns:110px 1fr 64px;align-items:center;gap:var(--space-4)}
.bar{height:12px;border-radius:var(--radius-pill);background:var(--paper-sunk);overflow:hidden}
.bar span{display:block;height:100%;border-radius:var(--radius-pill);background:var(--ink);transform-origin:left;transform:scaleX(var(--v));transition:transform 600ms var(--ease-out)}
.bar.complete span{background:var(--pulse)}
.r b{text-align:right;font-weight:600}
.foot{margin-top:var(--space-6);display:flex;flex-wrap:wrap;gap:var(--space-2)}
</style></head>
<body>
<div class="wrap" id="root">
  <section class="ev-card" aria-label="Study progress">
    <div class="head">
      <div><span class="ev-cap">Completed</span><div class="ev-stat">14 <span class="ev-muted" style="font-size:22px">of 20</span></div></div>
      <span class="ev-chip ev-chip-good"><i class="ph-bold ph-trend-up"></i>On track for 36 h</span>
    </div>
    <div class="rows ev-num">
      <div class="r"><span class="ev-small">Invited</span><div class="bar"><span style="--v:1"></span></div><b>142</b></div>
      <div class="r"><span class="ev-small">Accepted</span><div class="bar"><span style="--v:.18"></span></div><b>26</b></div>
      <div class="r"><span class="ev-small">Completed</span><div class="bar complete"><span style="--v:.7"></span></div><b>14</b></div>
    </div>
    <div class="foot">
      <span class="ev-chip ev-chip-critical"><i class="ph-bold ph-x-circle"></i>2 removed for quality, replaced free</span>
      <span class="ev-chip ev-chip-tide"><i class="ph-bold ph-users"></i>9 on campus, 5 off campus</span>
    </div>
  </section>
</div>
<script>document.getElementById('root').setAttribute('data-ready','1');</script>
</body></html>
