name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        id: install
        run: |
          if test -f pnpm-lock.yaml; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
            echo "generated-lockfile=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the bootstrap lockfile
        if: steps.install.outputs.generated-lockfile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Export the generated lockfile for the bootstrap commit
        if: steps.install.outputs.generated-lockfile == 'true'
        run: gzip -n -c pnpm-lock.yaml | base64 -w 1024 | sed 's/^/PUBLIC_LOCKFILE_BASE64 /'
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
