# Disposable Auth test fixture for the runner. Do not push it to a hosted project.
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = [
  "http://127.0.0.1:3100/api/researcher/auth/callback",
  "http://127.0.0.1:3100/api/respondent/auth/callback",
]

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[auth.email.template.magic_link]
subject = "Your Envoi Labs sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
